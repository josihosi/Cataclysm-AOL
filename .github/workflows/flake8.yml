name: Flake8 Python linting

on:
  push:
    branches:
    - dev
    - master
    paths:
    - '**.py'
    - '.flake8'
    - 'requirements-lint.txt'
    - 'Makefile'
    - '.github/workflows/flake8.yml'
  pull_request:
    branches:
    - dev
    - master
    paths:
    - '**.py'
    - '.flake8'
    - 'requirements-lint.txt'
    - 'Makefile'
    - '.github/workflows/flake8.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: '3.12'
    - name: install pinned lint dependencies
      run: python -m pip install -r requirements-lint.txt
    - name: Enable flake8 problem matcher
      run: echo "::add-matcher::build-scripts/problem-matchers/flake8.json"
    - name: run Flake8
      run: make python-check
