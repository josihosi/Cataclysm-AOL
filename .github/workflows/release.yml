name: "Experimental Release"

concurrency:
  group: release-${{ github.event.inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - port/cdda-master
      - port/cdda-0.H
      - port/cdda-0.I
      - port/ctlg-master
    paths:
      - '.github/actions/**'
      - '.github/workflows/compose-tilesets.yml'
      - '.github/workflows/build-translations.yml'
      - '.github/workflows/release.yml'
      - '.github/vcpkg_triplets/**'
      - 'android/**'
      - 'build-data/**'
      - 'build-scripts/**'
      - 'cataclysm-launcher'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'data/**'
      - 'doc/**'
      - 'gfx/**'
      - 'lang/**'
      - 'LICENSE*'
      - 'Makefile'
      - 'msvc-full-features/**'
      - 'README*'
      - 'src/**'
      - 'tools/build_shaders.py'
      - 'tools/format/**'
      - 'tools/llm_runner/**'
      - 'tools/openclaw_harness/**'
      - 'Plan.md'
      - 'TechnicalTome.md'
      - 'Agents.md'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to build and release
        required: true
        type: choice
        options:
          - port/cdda-master
          - port/cdda-0.H
          - port/cdda-0.I
          - port/ctlg-master

env:
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  TARGET_REF: ${{ github.event.inputs.target_branch || github.ref_name }}

jobs:
  release:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      timestamp: ${{ steps.get-timestamp.outputs.time }}
      target_ref: ${{ steps.metadata.outputs.target_ref }}
      target_sha: ${{ steps.resolve-target.outputs.target_sha }}
      branch_slug: ${{ steps.metadata.outputs.branch_slug }}
      branch_display: ${{ steps.metadata.outputs.branch_display }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      asset_prefix: ${{ steps.metadata.outputs.asset_prefix }}
      release_tag_prefix: ${{ steps.metadata.outputs.release_tag_prefix }}
      source_tar: ${{ steps.metadata.outputs.source_tar }}
      source_zip: ${{ steps.metadata.outputs.source_zip }}
      use_sdl3: ${{ steps.metadata.outputs.use_sdl3 }}
      handoff: ${{ steps.metadata.outputs.handoff }}
      vcpkg_commit: ${{ steps.metadata.outputs.vcpkg_commit }}
      msbuild_targets: ${{ steps.metadata.outputs.msbuild_targets }}
    steps:
      - name: Get build timestamp
        id: get-timestamp
        run: |
          echo "time=$(/bin/date -u "+%Y-%m-%d-%H%M")" >> "$GITHUB_OUTPUT"

      - name: Generate release metadata
        id: metadata
        env:
          BUILD_TIME: ${{ steps.get-timestamp.outputs.time }}
        run: |
          set -eu
          branch="${TARGET_REF}"
          case "$branch" in
            port/cdda-master)
              branch_display="CDDA master port"
              branch_key="cdda-master"
              source_tar="cataclysmdda-0.J.tar.gz"
              source_zip="cataclysmdda-0.J.zip"
              use_sdl3="true"
              handoff="true"
              vcpkg_commit="f6672d8e480ccdecddfad3fd1b838ba369ffe6cd"
              msbuild_targets="Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip"
              ;;
            port/cdda-0.H)
              branch_display="CDDA 0.H port"
              branch_key="cdda-0-h"
              source_tar="cataclysmdda-0.H.tar.gz"
              source_zip="cataclysmdda-0.H.zip"
              use_sdl3="false"
              handoff="false"
              vcpkg_commit="1b6e030cf096faf4f82d7b7025de8b2abee3e3df"
              msbuild_targets="Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static"
              ;;
            port/cdda-0.I)
              branch_display="CDDA 0.I port"
              branch_key="cdda-0-i"
              source_tar="cataclysmdda-0.I.tar.gz"
              source_zip="cataclysmdda-0.I.zip"
              use_sdl3="false"
              handoff="false"
              vcpkg_commit="1b6e030cf096faf4f82d7b7025de8b2abee3e3df"
              msbuild_targets="Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip"
              ;;
            port/ctlg-master)
              branch_display="CTLG master port"
              branch_key="ctlg-master"
              source_tar="cataclysm-tlg-1.0.tar.gz"
              source_zip="cataclysm-tlg-1.0.zip"
              use_sdl3="false"
              handoff="false"
              vcpkg_commit="1b6e030cf096faf4f82d7b7025de8b2abee3e3df"
              msbuild_targets="Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip"
              ;;
            *)
              echo "Unsupported target branch: $branch" >&2
              exit 1
              ;;
          esac

          tag_name="caol-${branch_key}-${BUILD_TIME}"
          release_name="Cataclysm: Arsenic and Old Lace ${branch_display} ${BUILD_TIME}"
          asset_prefix="caol_${branch_key}_${BUILD_TIME}"
          release_tag_prefix="caol-${branch_key}-"

          {
            echo "target_ref=$branch"
            echo "branch_slug=$branch_key"
            echo "branch_display=$branch_display"
            echo "tag_name=$tag_name"
            echo "release_name=$release_name"
            echo "asset_prefix=$asset_prefix"
            echo "release_tag_prefix=$release_tag_prefix"
            echo "source_tar=$source_tar"
            echo "source_zip=$source_zip"
            echo "use_sdl3=$use_sdl3"
            echo "handoff=$handoff"
            echo "vcpkg_commit=$vcpkg_commit"
            echo "msbuild_targets=$msbuild_targets"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || steps.metadata.outputs.target_ref }}
          fetch-tags: true
          persist-credentials: false

      - name: Resolve target commit
        id: resolve-target
        shell: bash
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify C-AOL Python contracts
        if: steps.metadata.outputs.target_ref == 'port/cdda-master'
        shell: bash
        run: |
          set -eu
          python -m pip install --disable-pip-version-check --requirement tools/openclaw_harness/requirements.txt
          python -m unittest discover -s tools/llm_runner -p 'test*.py' -v
          python tools/llm_runner/npc_harness.py --self-test
          python tools/llm_runner/run_action_status_fixtures.py
          python -m unittest discover -s tools/openclaw_harness -p 'test*.py' -v

  compose-tilesets:
    needs: release
    uses: ./.github/workflows/compose-tilesets.yml
    with:
      target_ref: ${{ needs.release.outputs.target_sha }}
      target_branch: ${{ needs.release.outputs.target_ref }}
  build-translations:
    needs: release
    uses: ./.github/workflows/build-translations.yml
    with:
      target_ref: ${{ needs.release.outputs.target_sha }}
    secrets:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}

  # Compile GLSL -> spv/dxil/msl once on Linux and share with every SDL3
  # platform job. Runtime variant_pass picks the format matching its GPU
  # backend (Vulkan/D3D12/Metal). Curses jobs do not fetch it.
  compile-shaders:
    name: Compile shaders
    needs: release
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repository
      if: needs.release.outputs.use_sdl3 == 'true'
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ needs.release.outputs.target_sha }}
        persist-credentials: false

    - name: build SDL3 shader artifacts
      if: needs.release.outputs.use_sdl3 == 'true'
      uses: ./.github/actions/build-sdl3-shaders

    - name: Skip shader compilation for SDL2 target
      if: needs.release.outputs.use_sdl3 != 'true'
      run: echo "${{ needs.release.outputs.target_ref }} uses the legacy SDL2 release path."

  builds:
    needs:
      - release
      - compose-tilesets
      - build-translations
      - compile-shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Tiles + Sound
            release_os: windows
            os: windows-2022
            ext: zip
            content: application/zip
            arch: x64
            tiles: 1
            sound: 1
          - name: Linux x64 Tiles + Sound
            release_os: linux
            os: ubuntu-24.04
            ext: tar.gz
            content: application/gzip
            android: none
            libbacktrace: 1
            tiles: 1
            sound: 1
          - name: macOS universal Tiles + Sound
            release_os: macos
            os: macos-15
            ext: dmg
            content: application/x-apple-diskimage
            tiles: 1
            sound: 1
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      ZSTD_CLEVEL: 17
    steps:
      - name: Maximize build space (mac)
        if: ${{ runner.os == 'macOS' }}
        run: |
          sudo rm -rf "$ANDROID_HOME"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release.outputs.target_sha }}
          fetch-tags: true
          persist-credentials: false

      - name: Get soundpack
        if: matrix.sound == 1
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/Fris0uman/CDDA-Soundpacks '${{ github.workspace }}/CDDA-Soundpacks'
          mv '${{ github.workspace }}/CDDA-Soundpacks/sound/CC-Sounds' '${{ github.workspace }}/data/sound'

      - name: Fetch tileset artifact into build
        if: matrix.tiles == 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tileset-*
          path: gfx
          merge-multiple: true

      - name: Fetch translations artifact into build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations

      - name: Fetch shader artifacts into build (SDL3)
        if: needs.release.outputs.use_sdl3 == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdda-shaders
          path: data/shaders

      - name: Mark shader artifacts fresh (SDL3)
        if: needs.release.outputs.use_sdl3 == 'true'
        shell: bash
        run: |
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl

      - name: Install dependencies (windows msvc) (1/4)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Install dependencies (windows msvc) (2/4)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ github.workspace }}/../b/vcpkg'
          vcpkgGitCommitId: ${{ needs.release.outputs.vcpkg_commit }}
      - name: Install dependencies (windows msvc) (3/4)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install --vcpkg-root "$env:RUNNER_WORKSPACE\b\vcpkg"

      - name: Install dependencies (windows msvc) (4/4)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msvc-full-features/vcpkg_installed
          key: release-vcpkg-installed-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-${{ needs.release.outputs.vcpkg_commit }}
      - name: Install dependencies (Linux, SDL2)
        if: runner.os == 'Linux' && matrix.android == 'none' && needs.release.outputs.use_sdl3 != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          git clone https://github.com/libsdl-org/SDL.git --branch release-2.0.20 --depth 1
          cd SDL
          mkdir build
          cd build
          ../configure
          make -j$((`nproc`+0))
          sudo make install
          cp ../LICENSE.txt ${{ github.workspace }}/LICENSE-SDL.txt
          sudo apt-get install -y libncursesw5-dev libsdl2-ttf-dev libsdl2-image-dev \
            libsdl2-mixer-dev libpulse-dev ccache gettext parallel
      - name: Install dependencies (Linux, SDL3)
        if: runner.os == 'Linux' && matrix.android == 'none' && needs.release.outputs.use_sdl3 == 'true'
        run: |
          sudo apt-get update
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y libncursesw5-dev ccache gettext parallel patchelf
      - name: Setup SDL3 stack (Linux, SDL3)
        if: runner.os == 'Linux' && matrix.android == 'none' && needs.release.outputs.use_sdl3 == 'true'
        uses: ./.github/actions/setup-sdl3-stack
        with:
          cache-key: sdl3-stack-strict-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-ubuntu-24.04-v2
          prefix: ${{ github.workspace }}/../sdl3_prefix
          stage-licenses: "true"
      - name: Install build dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install gettext ccache parallel dylibbundler
          pip3 install --break-system-packages dmgbuild biplist
      - name: Install runtime dependencies (mac, SDL2)
        if: runner.os == 'macOS' && needs.release.outputs.use_sdl3 != 'true'
        uses: BrettDong/setup-sdl2-frameworks@a8ca795ef904417e9ddcb010ef6bf2d11779dbe3 # v2
        with:
          sdl2: 2.30.11
          sdl2-ttf: 2.24.0
          sdl2-image: 2.8.4
          sdl2-mixer: 2.8.0
      - name: install macports (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        uses: melusina-org/setup-macports@c7eb59386def259a274627092566a7f7b8d219b1 # v1
      - name: install macports packages (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && needs.release.outputs.use_sdl3 == 'true'
        run: |
          # SDL_mixer VENDORED=OFF pulls every mixer codec from a system lib.
          # The macOS artifact is universal, so each (plus libiconv, a
          # transitive dep of flac/wavpack) must be +universal.
          sudo port install freetype +universal pkgconfig +universal \
              libiconv +universal libogg +universal flac +universal \
              libvorbis +universal wavpack +universal mpg123 +universal
      - name: install macports packages (mac, SDL2)
        if: runner.os == 'macOS' && matrix.tiles == 1 && needs.release.outputs.use_sdl3 != 'true'
        run: |
          sudo port install freetype +universal pkgconfig +universal
      - name: Cache SDL3 stack source build (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && needs.release.outputs.use_sdl3 == 'true'
        id: cache-sdl3-release-macos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../sdl3_prefix
          key: sdl3-stack-universal-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-${{ runner.os }}-v5
      - name: Build SDL3 stack from source (mac, SDL3, universal)
        if: runner.os == 'macOS' && matrix.tiles == 1 && needs.release.outputs.use_sdl3 == 'true' && steps.cache-sdl3-release-macos.outputs.cache-hit != 'true'
        run: |
          PREFIX=$RUNNER_WORKSPACE/sdl3_prefix
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:/opt/local/lib/pkgconfig
          # wavpack's Findwavpack.cmake uses plain find_library (no pkg-config),
          # so /opt/local must be on CMAKE_PREFIX_PATH.
          export CMAKE_PREFIX_PATH=$PREFIX:/opt/local
          ARCH_ARG='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          git clone --depth 1 --branch release-3.4.10 https://github.com/libsdl-org/SDL.git sdl3_src
          cmake -S sdl3_src -B sdl3_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_build
          git clone --depth 1 --branch release-3.4.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_image.git sdl3_image_src
          cmake -S sdl3_image_src -B sdl3_image_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLIMAGE_VENDORED=ON \
              -DSDLIMAGE_DEPS_SHARED=OFF \
              -DSDLIMAGE_STRICT=ON \
              -DSDLIMAGE_BACKEND_IMAGEIO=OFF \
              -DSDLIMAGE_PNG=ON -DSDLIMAGE_PNG_LIBPNG=ON \
              -DSDLIMAGE_JPG=ON \
              -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF \
              -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF \
              -DPNG_ARM_NEON=off \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_image_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_image_build
          git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git sdl3_ttf_src
          cmake -S sdl3_ttf_src -B sdl3_ttf_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLTTF_VENDORED=ON \
              -DSDLTTF_STRICT=ON \
              -DSDLTTF_PLUTOSVG=OFF \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_ttf_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_ttf_build
          git clone --depth 1 --branch release-3.2.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_mixer.git sdl3_mixer_src
          # VENDORED=OFF links the MacPorts codecs (LC_LOAD_DYLIB), not static-
          # embed; mpg123 (LGPL) ships as a separate dylib. DEPS_SHARED=OFF keeps
          # real link edges, not dlopen-by-name (no LC_LOAD_DYLIB, breaks bundler).
          cmake -S sdl3_mixer_src -B sdl3_mixer_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLMIXER_VENDORED=OFF \
              -DSDLMIXER_DEPS_SHARED=OFF \
              -DSDLMIXER_STRICT=ON \
              -DSDLMIXER_FLAC=ON -DSDLMIXER_FLAC_LIBFLAC=ON -DSDLMIXER_FLAC_DRFLAC=OFF \
              -DSDLMIXER_MP3=ON -DSDLMIXER_MP3_MPG123=ON -DSDLMIXER_MP3_MPG123_SHARED=OFF -DSDLMIXER_MP3_DRMP3=OFF \
              -DSDLMIXER_VORBIS_VORBISFILE=ON -DSDLMIXER_VORBIS_STB=OFF -DSDLMIXER_VORBIS_TREMOR=OFF \
              -DSDLMIXER_WAVPACK=ON \
              -DSDLMIXER_OPUS=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_GME=OFF \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_mixer_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_mixer_build
          # Confirm a real link edge, not dlopen-by-name: otherwise
          # dylibbundler ships no mpg123 dylib and LGPL swappability is lost.
          if ! otool -L "$PREFIX"/lib/libSDL3_mixer*.dylib | grep -q mpg123; then
              echo "ERROR: SDL3_mixer.dylib has no mpg123 LC_LOAD_DYLIB edge" >&2
              exit 1
          fi
          mkdir -p $PREFIX/share
          cp sdl3_src/LICENSE.txt $PREFIX/share/LICENSE-SDL.txt
          cp sdl3_image_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_image.txt
          cp sdl3_ttf_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_ttf.txt
          cp sdl3_mixer_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_mixer.txt
          # SDL_image/SDL_ttf use VENDORED=ON (codecs static in the companion
          # dylib), so harvest each codec's LICENSE/COPYING from external/.
          for dep in \
              sdl3_image_src/external/libpng \
              sdl3_image_src/external/jpeg \
              sdl3_ttf_src/external/freetype \
              sdl3_ttf_src/external/harfbuzz; do
              if [ -d "$dep" ]; then
                  name=$(basename "$dep")
                  for cand in "$dep"/LICENSE "$dep"/LICENSE.txt "$dep"/LICENSE.md \
                              "$dep"/COPYING "$dep"/COPYING.txt "$dep"/COPYING.LIB \
                              "$dep"/copyright; do
                      if [ -f "$cand" ]; then
                          cp "$cand" "$PREFIX/share/LICENSE-vendored-$name.txt"
                          break
                      fi
                  done
              fi
          done
          # SDL_mixer VENDORED=OFF ships flac/ogg/vorbis/mpg123/wavpack as
          # separate MacPorts dylibs (no license installed); glob COPYING*/
          # LICENSE* from each SDL_mixer submodule (FLAC uses COPYING.Xiph), fail if empty.
          for dep in flac ogg vorbis mpg123 wavpack; do
              src="sdl3_mixer_src/external/$dep"
              out="$PREFIX/share/LICENSE-vendored-$dep.txt"
              : > "$out"
              for lic in "$src"/COPYING* "$src"/COPYRIGHT* "$src"/LICENSE* "$src"/License* "$src"/license*; do
                  if [ -f "$lic" ]; then
                      echo "=== $(basename "$lic") ===" >> "$out"
                      cat "$lic" >> "$out"
                      echo >> "$out"
                  fi
              done
              if [ ! -s "$out" ]; then
                  echo "ERROR: no license for bundled codec $dep in SDL_mixer source" >&2
                  exit 1
              fi
          done
      - name: Stage SDL3 license files (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && needs.release.outputs.use_sdl3 == 'true'
        run: |
          cp "$RUNNER_WORKSPACE/sdl3_prefix/share/LICENSE-SDL.txt" ${{ github.workspace }}/LICENSE-SDL.txt
          cp "$RUNNER_WORKSPACE/sdl3_prefix/share/LICENSE-SDL3_image.txt" ${{ github.workspace }}/LICENSE-SDL3_image.txt
          cp "$RUNNER_WORKSPACE/sdl3_prefix/share/LICENSE-SDL3_ttf.txt" ${{ github.workspace }}/LICENSE-SDL3_ttf.txt
          cp "$RUNNER_WORKSPACE/sdl3_prefix/share/LICENSE-SDL3_mixer.txt" ${{ github.workspace }}/LICENSE-SDL3_mixer.txt
          for f in "$RUNNER_WORKSPACE"/sdl3_prefix/share/LICENSE-vendored-*.txt; do
              if [ -f "$f" ]; then
                  cp "$f" "${{ github.workspace }}/$(basename "$f")"
              fi
          done
          # libiconv (LGPL) is bundled transitively via flac/wavpack but has no
          # license on the MacPorts install or in any source tree, so ship the
          # vendored copy committed in the repo.
          cp ${{ github.workspace }}/build-data/osx/LICENSE-libiconv.txt ${{ github.workspace }}/LICENSE-vendored-libiconv.txt
          # Every bundled codec plus libiconv must carry a non-empty license,
          # independent of cache state (a stale prefix could skip the harvest).
          for required in libiconv flac ogg vorbis mpg123 wavpack; do
              if [ ! -s "${{ github.workspace }}/LICENSE-vendored-$required.txt" ]; then
                  echo "ERROR: LICENSE-vendored-$required.txt missing or empty" >&2
                  exit 1
              fi
          done
      - name: Create VERSION.TXT
        shell: bash
        run: |
          commit_sha="$(git rev-parse HEAD)"
          cat > VERSION.txt <<EOL
          build type: ${{ matrix.release_os }}
          build number: ${{ needs.release.outputs.timestamp }}
          target branch: ${{ needs.release.outputs.target_ref }}
          commit sha: ${commit_sha}
          commit url: https://github.com/${{ github.repository }}/commit/${commit_sha}
          EOL

      - name: Compile translations (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all

      - name: Build libbacktrace
        if: matrix.libbacktrace == 1
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j$((`nproc`+0))
          cp LICENSE ${{ github.workspace }}/LICENSE-libbacktrace.txt
          sudo make install

      - name: Build CDDA (linux)
        if: runner.os == 'Linux' && matrix.android == 'none'
        run: |
          if [ "${{ needs.release.outputs.use_sdl3 }}" = "true" ]; then
            export PKG_CONFIG_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib/pkgconfig:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu/pkgconfig"
            export LD_LIBRARY_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu"
          fi
          make COMPILER=clang++-18 -j$((`nproc`+0)) TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} SDL3=${{ needs.release.outputs.use_sdl3 == 'true' && '1' || '0' }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=${{ matrix.libbacktrace }} WARN_STALE_DATA=1 PCH=0 bindist
          mv '${{ needs.release.outputs.source_tar }}' '${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}'

      - name: Build CDDA (windows msvc)
        if: runner.os == 'Windows'
        env:
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        shell: pwsh
        run: |
          $target = 'msvc-full-features\Cataclysm-vcpkg-static.sln'
          $args = @('-m', '-p:Configuration=Release', '-p:Platform=${{ matrix.arch }}', '-target:${{ needs.release.outputs.msbuild_targets }}', $target)
          for( $attempt = 1; $attempt -le 2; $attempt++ ) {
            Write-Host "Windows build attempt $attempt/2"
            & msbuild @args
            if( $LASTEXITCODE -eq 0 ) {
              break
            }
            if( $attempt -eq 2 ) {
              exit $LASTEXITCODE
            }
            Write-Host 'msbuild failed; retrying once after a short backoff in case vcpkg download flaked out.'
            Start-Sleep -Seconds 20
          }
          if( '${{ needs.release.outputs.use_sdl3 }}' -eq 'true' ) {
            .\build-scripts\windist.ps1 -SDL3
          } else {
            .\build-scripts\windist.ps1
          }
          Move-Item '${{ needs.release.outputs.source_zip }}' '${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}'

      - name: Dump vcpkg logs if Windows build failed
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host '=== vcpkg_installed tree ==='
          if( Test-Path 'msvc-full-features\vcpkg_installed' ) {
            Get-ChildItem 'msvc-full-features\vcpkg_installed' -Recurse
          }
          Write-Host '=== vcpkg buildtrees logs ==='
          $buildtrees = Join-Path $env:RUNNER_WORKSPACE 'b\vcpkg\buildtrees'
          if( Test-Path $buildtrees ) {
            Get-ChildItem $buildtrees | ForEach-Object {
              Get-ChildItem $_.FullName -Filter *.log | ForEach-Object {
                Write-Host '========================================'
                Write-Host $_.FullName
                Write-Host '========================================'
                Get-Content $_.FullName
              }
            }
          }

      - name: Build CDDA (osx, SDL2)
        if: runner.os == 'macOS' && needs.release.outputs.use_sdl3 != 'true'
        run: |
          make -j3 TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 FRAMEWORK=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=1 dmgdist
          mv Cataclysm.dmg '${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}'

      - name: Build CDDA (osx, SDL3)
        if: runner.os == 'macOS' && needs.release.outputs.use_sdl3 == 'true'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/../sdl3_prefix/lib/pkgconfig:/opt/local/lib/pkgconfig
          DYLIBBUNDLER_SEARCH_PATHS: ${{ github.workspace }}/../sdl3_prefix/lib /opt/local/lib
        run: |
          make -j3 TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} SDL3=1 RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=1 dmgdist
          if ! ls Cataclysm.app/Contents/Resources/libmpg123*.dylib >/dev/null 2>&1; then
              echo "ERROR: libmpg123 dylib missing from app bundle Resources" >&2
              exit 1
          fi
          mv Cataclysm.dmg ${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}

      - name: Verify manual handoff release asset
        if: needs.release.outputs.handoff == 'true'
        shell: bash
        run: |
          python tools/openclaw_harness/verify_release_asset.py \
            '${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}' \
            --platform '${{ matrix.release_os }}' \
            --expected-branch '${{ needs.release.outputs.target_ref }}' \
            --expected-build-number '${{ needs.release.outputs.timestamp }}' \
            --expected-commit '${{ needs.release.outputs.target_sha }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.release_os }}
          path: ${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish verified prerelease
    needs:
      - release
      - builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release.outputs.target_sha }}
          fetch-tags: true
          persist-credentials: false

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify exact artifact set and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            '${{ needs.release.outputs.asset_prefix }}_linux.tar.gz'
            '${{ needs.release.outputs.asset_prefix }}_macos.dmg'
            '${{ needs.release.outputs.asset_prefix }}_windows.zip'
          )

          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            printf 'Expected exactly %s release artifacts, found %s:\n' "${#expected[@]}" "${#actual[@]}" >&2
            printf '  %s\n' "${actual[@]}" >&2
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [ "${actual[$index]}" != "${expected[$index]}" ]; then
              printf 'Release artifact mismatch at index %s: expected %s, found %s\n' \
                "$index" "${expected[$index]}" "${actual[$index]}" >&2
              exit 1
            fi
            if [ ! -s "dist/${expected[$index]}" ]; then
              printf 'Release artifact is missing or empty: %s\n' "dist/${expected[$index]}" >&2
              exit 1
            fi
          done

          cd dist
          sha256sum "${expected[@]}" > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
          sha256sum --check SHA256SUMS.txt

      - name: Fail on release or tag collision
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ needs.release.outputs.tag_name }}'

          require_absent() {
            endpoint="$1"
            description="$2"
            response_file="$(mktemp)"
            status=0
            if ! status="$(curl --silent --show-error --location \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${{ github.repository }}/$endpoint")"; then
              echo "Unable to check $description; refusing to publish." >&2
              cat "$response_file" >&2
              rm -f "$response_file"
              exit 1
            fi
            case "$status" in
              404)
                rm -f "$response_file"
                ;;
              200)
                echo "$description already exists; refusing to reuse it." >&2
                cat "$response_file" >&2
                rm -f "$response_file"
                exit 1
                ;;
              *)
                echo "Unexpected HTTP $status while checking $description; refusing to publish." >&2
                cat "$response_file" >&2
                rm -f "$response_file"
                exit 1
                ;;
            esac
          }

          require_absent "releases/tags/$tag" "release for $tag"
          require_absent "git/ref/tags/$tag" "tag $tag"

      - name: Generate non-empty release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node build-scripts/generate-release-notes.js \
            '${{ needs.release.outputs.tag_name }}' \
            '${{ needs.release.outputs.target_sha }}' \
            '${{ needs.release.outputs.release_tag_prefix }}' \
            '${{ needs.release.outputs.target_ref }}' \
            > auto-notes.txt
          if [ ! -s auto-notes.txt ]; then
            echo 'Generated release notes are empty; refusing to publish.' >&2
            exit 1
          fi

          {
            printf '# %s\n\n' '${{ needs.release.outputs.release_name }}'
            printf -- '- target branch: `%s`\n' '${{ needs.release.outputs.target_ref }}'
            printf -- '- commit: `%s`\n' '${{ needs.release.outputs.target_sha }}'
            printf -- '- built at: `%s` UTC\n' '${{ needs.release.outputs.timestamp }}'
            printf -- '- macOS trust: ad-hoc signed and integrity-checked; not Developer ID signed or notarized\n\n'
            cat auto-notes.txt
          } > notes.txt
          test -s notes.txt

      - name: Create prerelease with all verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create '${{ needs.release.outputs.tag_name }}' \
            'dist/${{ needs.release.outputs.asset_prefix }}_windows.zip' \
            'dist/${{ needs.release.outputs.asset_prefix }}_linux.tar.gz' \
            'dist/${{ needs.release.outputs.asset_prefix }}_macos.dmg' \
            dist/SHA256SUMS.txt \
            --latest=false \
            --notes-file notes.txt \
            --prerelease \
            --repo '${{ github.repository }}' \
            --target '${{ needs.release.outputs.target_sha }}' \
            --title '${{ needs.release.outputs.release_name }}'
