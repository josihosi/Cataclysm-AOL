name: "Experimental Release"

concurrency:
  group: release-${{ github.event.inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    branches:
      - port/cdda-master
      - port/cdda-0.H
      - port/cdda-0.I
      - port/ctlg-master
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to build and release
        required: true
        type: choice
        options:
          - port/cdda-master
          - port/cdda-0.H
          - port/cdda-0.I
          - port/ctlg-master

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  TARGET_REF: ${{ github.event.inputs.target_branch || github.ref_name }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      timestamp: ${{ steps.get-timestamp.outputs.time }}
      target_ref: ${{ steps.metadata.outputs.target_ref }}
      branch_slug: ${{ steps.metadata.outputs.branch_slug }}
      branch_display: ${{ steps.metadata.outputs.branch_display }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      asset_prefix: ${{ steps.metadata.outputs.asset_prefix }}
      release_tag_prefix: ${{ steps.metadata.outputs.release_tag_prefix }}
    steps:
      - name: Get build timestamp
        id: get-timestamp
        run: |
          echo "time=$(/bin/date -u "+%Y-%m-%d-%H%M")" >> "$GITHUB_OUTPUT"

      - name: Generate release metadata
        id: metadata
        env:
          BUILD_TIME: ${{ steps.get-timestamp.outputs.time }}
        run: |
          set -eu
          branch="${TARGET_REF}"
          case "$branch" in
            port/cdda-master)
              branch_display="CDDA master port"
              branch_key="cdda-master"
              ;;
            port/cdda-0.H)
              branch_display="CDDA 0.H port"
              branch_key="cdda-0-h"
              ;;
            port/cdda-0.I)
              branch_display="CDDA 0.I port"
              branch_key="cdda-0-i"
              ;;
            port/ctlg-master)
              branch_display="CTLG master port"
              branch_key="ctlg-master"
              ;;
            *)
              echo "Unsupported target branch: $branch" >&2
              exit 1
              ;;
          esac

          tag_name="caol-${branch_key}-${BUILD_TIME}"
          release_name="Cataclysm: Arsenic and Old Lace ${branch_display} ${BUILD_TIME}"
          asset_prefix="caol_${branch_key}_${BUILD_TIME}"
          release_tag_prefix="caol-${branch_key}-"

          {
            echo "target_ref=$branch"
            echo "branch_slug=$branch_key"
            echo "branch_display=$branch_display"
            echo "tag_name=$tag_name"
            echo "release_name=$release_name"
            echo "asset_prefix=$asset_prefix"
            echo "release_tag_prefix=$release_tag_prefix"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.metadata.outputs.target_ref }}
          fetch-tags: true
          persist-credentials: false

      - name: Generate release notes
        id: generate-release-notes
        run: |
          set -eu
          npm install @actions/github@8
          node build-scripts/generate-release-notes.js \
            '${{ secrets.GITHUB_TOKEN }}' \
            '${{ steps.metadata.outputs.tag_name }}' \
            "$(git log -1 --format='%H')" \
            '${{ steps.metadata.outputs.release_tag_prefix }}' \
            '${{ steps.metadata.outputs.target_ref }}' \
            > auto-notes.txt

          {
            printf '# %s\n\n' '${{ steps.metadata.outputs.release_name }}'
            printf -- '- target branch: `%s`\n' '${{ steps.metadata.outputs.target_ref }}'
            printf -- '- commit: `%s`\n' "$(git rev-parse --short HEAD)"
            printf -- '- built at: `%s` UTC\n\n' '${{ steps.get-timestamp.outputs.time }}'
            cat auto-notes.txt
          } > notes.txt

      - name: Create or reuse GitHub release
        run: |
          set -eu
          if gh release view '${{ steps.metadata.outputs.tag_name }}' >/dev/null 2>&1; then
            echo "Release ${{ steps.metadata.outputs.tag_name }} already exists, reusing it."
          else
            gh release create '${{ steps.metadata.outputs.tag_name }}' \
              --notes-file notes.txt \
              --prerelease \
              --title '${{ steps.metadata.outputs.release_name }}' \
              --target "$(git log -1 --format='%H')"
          fi

  compose-tilesets:
    uses: ./.github/workflows/compose-tilesets.yml
    with:
      target_ref: ${{ github.event.inputs.target_branch || github.ref_name }}
  build-translations:
    uses: ./.github/workflows/build-translations.yml
    with:
      target_ref: ${{ github.event.inputs.target_branch || github.ref_name }}
    secrets:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}

  # Compile GLSL -> spv/dxil/msl once on Linux and share with every SDL3
  # platform job. Runtime variant_pass picks the format matching its GPU
  # backend (Vulkan/D3D12/Metal). Curses jobs do not fetch it.
  compile-shaders:
    name: Compile shaders
    # Default SDL3 release builds need these shader artifacts.
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ github.event.inputs.target_branch || github.ref_name }}
        persist-credentials: false

    - name: build SDL3 shader artifacts
      uses: ./.github/actions/build-sdl3-shaders

  builds:
    needs:
      - release
      - compose-tilesets
      - build-translations
      - compile-shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Tiles + Sound
            release_os: windows
            os: windows-2022
            ext: zip
            content: application/zip
            arch: x64
            tiles: 1
            sound: 1
            sdl3: 1
          - name: Linux x64 Tiles + Sound
            release_os: linux
            os: ubuntu-24.04
            ext: tar.gz
            content: application/gzip
            android: none
            libbacktrace: 1
            tiles: 1
            sound: 1
            sdl3: 1
          - name: macOS universal Tiles + Sound
            release_os: macos
            os: macos-15
            ext: dmg
            content: application/x-apple-diskimage
            tiles: 1
            sound: 1
            sdl3: 1
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions: write-all
    env:
      ZSTD_CLEVEL: 17
    steps:
      - name: Maximize build space (mac)
        if: ${{ runner.os == 'macOS' }}
        run: |
          sudo rm -rf "$ANDROID_HOME"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release.outputs.target_ref }}
          fetch-tags: true
          persist-credentials: false

      - name: Get soundpack
        if: matrix.sound == 1
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/Fris0uman/CDDA-Soundpacks '${{ github.workspace }}/CDDA-Soundpacks'
          mv '${{ github.workspace }}/CDDA-Soundpacks/sound/CC-Sounds' '${{ github.workspace }}/data/sound'

      - name: Fetch tileset artifact into build
        if: matrix.tiles == 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tileset-*
          path: gfx
          merge-multiple: true

      - name: Fetch translations artifact into build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: translations

      - name: Fetch shader artifacts into build (SDL3)
        if: matrix.sdl3 == 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdda-shaders
          path: data/shaders

      - name: Mark shader artifacts fresh (SDL3)
        if: matrix.sdl3 == 1
        shell: bash
        run: |
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl

      - name: Install dependencies (windows msvc) (1/4)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Install dependencies (windows msvc) (2/4)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@7d259227a1fb6471a0253dd5ab7419835228f7d7 # v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'
      - name: Install dependencies (windows msvc) (3/4)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'

      - name: Install dependencies (windows msvc) (4/4)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make
      - name: Cache vcpkg packages (Windows, SDL3)
        if: runner.os == 'Windows' && matrix.sdl3 == 1
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: msvc-full-features/vcpkg_installed
          key: vcpkg-installed-sdl3-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
      - name: Install dependencies (Linux, curses)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm && matrix.tiles != 1
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev ccache gettext parallel
      - name: Install dependencies (Linux, SDL3)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm && matrix.sdl3 == 1
        run: |
          sudo apt-get update
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y libncursesw5-dev ccache gettext parallel patchelf
      - name: Setup SDL3 stack (Linux, SDL3)
        if: runner.os == 'Linux' && matrix.android == 'none' && !matrix.wasm && matrix.sdl3 == 1
        uses: ./.github/actions/setup-sdl3-stack
        with:
          cache-key: sdl3-stack-strict-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-ubuntu-24.04-v2
          prefix: ${{ runner.workspace }}/sdl3_prefix
          stage-licenses: "true"
      - name: Install Emscripten (WebAssembly)
        if: matrix.wasm
        uses: mymindstorm/setup-emsdk@d233ac12b0102f74ca199f5dad7a4e2c13a8a745 # v13
      - name: Install build dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install gettext ccache parallel dylibbundler
          pip3 install --break-system-packages dmgbuild biplist
      - name: install macports (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 == 1
        uses: melusina-org/setup-macports@c7eb59386def259a274627092566a7f7b8d219b1 # v1
      - name: install macports packages (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 == 1
        run: |
          # SDL_mixer VENDORED=OFF pulls every mixer codec from a system lib.
          # The macOS artifact is universal, so each (plus libiconv, a
          # transitive dep of flac/wavpack) must be +universal.
          sudo port install freetype +universal pkgconfig +universal \
              libiconv +universal libogg +universal flac +universal \
              libvorbis +universal wavpack +universal mpg123 +universal
      - name: Cache SDL3 stack source build (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 == 1
        id: cache-sdl3-release-macos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.workspace }}/sdl3_prefix
          key: sdl3-stack-universal-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-${{ runner.os }}-v5
      - name: Build SDL3 stack from source (mac, SDL3, universal)
        if: runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 == 1 && steps.cache-sdl3-release-macos.outputs.cache-hit != 'true'
        run: |
          PREFIX=${{ runner.workspace }}/sdl3_prefix
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:/opt/local/lib/pkgconfig
          # wavpack's Findwavpack.cmake uses plain find_library (no pkg-config),
          # so /opt/local must be on CMAKE_PREFIX_PATH.
          export CMAKE_PREFIX_PATH=$PREFIX:/opt/local
          ARCH_ARG='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          git clone --depth 1 --branch release-3.4.10 https://github.com/libsdl-org/SDL.git sdl3_src
          cmake -S sdl3_src -B sdl3_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_build
          git clone --depth 1 --branch release-3.4.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_image.git sdl3_image_src
          cmake -S sdl3_image_src -B sdl3_image_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLIMAGE_VENDORED=ON \
              -DSDLIMAGE_DEPS_SHARED=OFF \
              -DSDLIMAGE_STRICT=ON \
              -DSDLIMAGE_BACKEND_IMAGEIO=OFF \
              -DSDLIMAGE_PNG=ON -DSDLIMAGE_PNG_LIBPNG=ON \
              -DSDLIMAGE_JPG=ON \
              -DSDLIMAGE_AVIF=OFF -DSDLIMAGE_JXL=OFF \
              -DSDLIMAGE_TIF=OFF -DSDLIMAGE_WEBP=OFF \
              -DPNG_ARM_NEON=off \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_image_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_image_build
          git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git sdl3_ttf_src
          cmake -S sdl3_ttf_src -B sdl3_ttf_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLTTF_VENDORED=ON \
              -DSDLTTF_STRICT=ON \
              -DSDLTTF_PLUTOSVG=OFF \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_ttf_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_ttf_build
          git clone --depth 1 --branch release-3.2.4 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_mixer.git sdl3_mixer_src
          # VENDORED=OFF links the MacPorts codecs (LC_LOAD_DYLIB), not static-
          # embed; mpg123 (LGPL) ships as a separate dylib. DEPS_SHARED=OFF keeps
          # real link edges, not dlopen-by-name (no LC_LOAD_DYLIB, breaks bundler).
          cmake -S sdl3_mixer_src -B sdl3_mixer_build "$ARCH_ARG" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=$PREFIX \
              -DSDLMIXER_VENDORED=OFF \
              -DSDLMIXER_DEPS_SHARED=OFF \
              -DSDLMIXER_STRICT=ON \
              -DSDLMIXER_FLAC=ON -DSDLMIXER_FLAC_LIBFLAC=ON -DSDLMIXER_FLAC_DRFLAC=OFF \
              -DSDLMIXER_MP3=ON -DSDLMIXER_MP3_MPG123=ON -DSDLMIXER_MP3_MPG123_SHARED=OFF -DSDLMIXER_MP3_DRMP3=OFF \
              -DSDLMIXER_VORBIS_VORBISFILE=ON -DSDLMIXER_VORBIS_STB=OFF -DSDLMIXER_VORBIS_TREMOR=OFF \
              -DSDLMIXER_WAVPACK=ON \
              -DSDLMIXER_OPUS=OFF -DSDLMIXER_MOD=OFF -DSDLMIXER_MIDI=OFF -DSDLMIXER_GME=OFF \
              -DBUILD_SHARED_LIBS=ON
          cmake --build sdl3_mixer_build -j$(sysctl -n hw.ncpu)
          cmake --install sdl3_mixer_build
          # Confirm a real link edge, not dlopen-by-name: otherwise
          # dylibbundler ships no mpg123 dylib and LGPL swappability is lost.
          if ! otool -L "$PREFIX"/lib/libSDL3_mixer*.dylib | grep -q mpg123; then
              echo "ERROR: SDL3_mixer.dylib has no mpg123 LC_LOAD_DYLIB edge" >&2
              exit 1
          fi
          mkdir -p $PREFIX/share
          cp sdl3_src/LICENSE.txt $PREFIX/share/LICENSE-SDL.txt
          cp sdl3_image_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_image.txt
          cp sdl3_ttf_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_ttf.txt
          cp sdl3_mixer_src/LICENSE.txt $PREFIX/share/LICENSE-SDL3_mixer.txt
          # SDL_image/SDL_ttf use VENDORED=ON (codecs static in the companion
          # dylib), so harvest each codec's LICENSE/COPYING from external/.
          for dep in \
              sdl3_image_src/external/libpng \
              sdl3_image_src/external/jpeg \
              sdl3_ttf_src/external/freetype \
              sdl3_ttf_src/external/harfbuzz; do
              if [ -d "$dep" ]; then
                  name=$(basename "$dep")
                  for cand in "$dep"/LICENSE "$dep"/LICENSE.txt "$dep"/LICENSE.md \
                              "$dep"/COPYING "$dep"/COPYING.txt "$dep"/COPYING.LIB \
                              "$dep"/copyright; do
                      if [ -f "$cand" ]; then
                          cp "$cand" "$PREFIX/share/LICENSE-vendored-$name.txt"
                          break
                      fi
                  done
              fi
          done
          # SDL_mixer VENDORED=OFF ships flac/ogg/vorbis/mpg123/wavpack as
          # separate MacPorts dylibs (no license installed); glob COPYING*/
          # LICENSE* from each SDL_mixer submodule (FLAC uses COPYING.Xiph), fail if empty.
          for dep in flac ogg vorbis mpg123 wavpack; do
              src="sdl3_mixer_src/external/$dep"
              out="$PREFIX/share/LICENSE-vendored-$dep.txt"
              : > "$out"
              for lic in "$src"/COPYING* "$src"/COPYRIGHT* "$src"/LICENSE* "$src"/License* "$src"/license*; do
                  if [ -f "$lic" ]; then
                      echo "=== $(basename "$lic") ===" >> "$out"
                      cat "$lic" >> "$out"
                      echo >> "$out"
                  fi
              done
              if [ ! -s "$out" ]; then
                  echo "ERROR: no license for bundled codec $dep in SDL_mixer source" >&2
                  exit 1
              fi
          done
      - name: Stage SDL3 license files (mac, SDL3)
        if: runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 == 1
        run: |
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL.txt ${{ github.workspace }}/LICENSE-SDL.txt
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL3_image.txt ${{ github.workspace }}/LICENSE-SDL3_image.txt
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL3_ttf.txt ${{ github.workspace }}/LICENSE-SDL3_ttf.txt
          cp ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-SDL3_mixer.txt ${{ github.workspace }}/LICENSE-SDL3_mixer.txt
          for f in ${{ runner.workspace }}/sdl3_prefix/share/LICENSE-vendored-*.txt; do
              if [ -f "$f" ]; then
                  cp "$f" "${{ github.workspace }}/$(basename "$f")"
              fi
          done
          # libiconv (LGPL) is bundled transitively via flac/wavpack but has no
          # license on the MacPorts install or in any source tree, so ship the
          # vendored copy committed in the repo.
          cp ${{ github.workspace }}/build-data/osx/LICENSE-libiconv.txt ${{ github.workspace }}/LICENSE-vendored-libiconv.txt
          # Every bundled codec plus libiconv must carry a non-empty license,
          # independent of cache state (a stale prefix could skip the harvest).
          for required in libiconv flac ogg vorbis mpg123 wavpack; do
              if [ ! -s "${{ github.workspace }}/LICENSE-vendored-$required.txt" ]; then
                  echo "ERROR: LICENSE-vendored-$required.txt missing or empty" >&2
                  exit 1
              fi
          done
      - name: Create VERSION.TXT
        shell: bash
        run: |
          commit_sha="$(git rev-parse HEAD)"
          cat > VERSION.txt <<EOL
          build type: ${{ matrix.release_os }}
          build number: ${{ needs.release.outputs.timestamp }}
          target branch: ${{ needs.release.outputs.target_ref }}
          commit sha: ${commit_sha}
          commit url: https://github.com/${{ github.repository }}/commit/${commit_sha}
          EOL

      - name: Compile translations (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all

      - name: Build libbacktrace
        if: matrix.libbacktrace == 1
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j$((`nproc`+0))
          cp LICENSE ${{ github.workspace }}/LICENSE-libbacktrace.txt
          sudo make install

      - name: Build CDDA (linux)
        if: runner.os == 'Linux' && matrix.android == 'none'
        run: |
          if [ "${{ matrix.sdl3 }}" = "1" ]; then
            export PKG_CONFIG_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib/pkgconfig:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu/pkgconfig"
            export LD_LIBRARY_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu"
          fi
          make COMPILER=clang++-18 -j$((`nproc`+0)) TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} SDL3=${{ matrix.sdl3 == 1 && '1' || '0' }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=${{ matrix.libbacktrace }} WARN_STALE_DATA=1 PCH=0 bindist
          mv cataclysmdda-0.J.tar.gz ${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}

      - name: Build CDDA (windows msvc)
        if: runner.os == 'Windows'
        env:
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        shell: pwsh
        run: |
          $target = 'msvc-full-features\Cataclysm-vcpkg-static.sln'
          $args = @('-m', '-p:Configuration=Release', '-p:Platform=${{ matrix.arch }}', '-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip', $target)
          for( $attempt = 1; $attempt -le 2; $attempt++ ) {
            Write-Host "Windows build attempt $attempt/2"
            & msbuild @args
            if( $LASTEXITCODE -eq 0 ) {
              break
            }
            if( $attempt -eq 2 ) {
              exit $LASTEXITCODE
            }
            Write-Host 'msbuild failed; retrying once after a short backoff in case vcpkg download flaked out.'
            Start-Sleep -Seconds 20
          }
          .\build-scripts\windist.ps1 -SDL3
          Move-Item cataclysmdda-0.J.zip ${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}

      - name: Dump vcpkg logs if Windows build failed
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host '=== vcpkg_installed tree ==='
          if( Test-Path 'msvc-full-features\vcpkg_installed' ) {
            Get-ChildItem 'msvc-full-features\vcpkg_installed' -Recurse
          }
          Write-Host '=== vcpkg buildtrees logs ==='
          $buildtrees = Join-Path '${{ runner.workspace }}' 'b\vcpkg\buildtrees'
          if( Test-Path $buildtrees ) {
            Get-ChildItem $buildtrees | ForEach-Object {
              Get-ChildItem $_.FullName -Filter *.log | ForEach-Object {
                Write-Host '========================================'
                Write-Host $_.FullName
                Write-Host '========================================'
                Get-Content $_.FullName
              }
            }
          }

      - name: Build CDDA (osx, SDL3)
        if: runner.os == 'macOS' && matrix.sdl3 == 1
        env:
          PKG_CONFIG_PATH: ${{ runner.workspace }}/sdl3_prefix/lib/pkgconfig:/opt/local/lib/pkgconfig
          DYLIBBUNDLER_SEARCH_PATHS: ${{ runner.workspace }}/sdl3_prefix/lib /opt/local/lib
        run: |
          make -j3 TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} SDL3=1 RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=1 dmgdist
          if ! ls Cataclysm.app/Contents/Resources/libmpg123*.dylib >/dev/null 2>&1; then
              echo "ERROR: libmpg123 dylib missing from app bundle Resources" >&2
              exit 1
          fi
          mv Cataclysm.dmg ${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}

      - name: Verify manual handoff release asset
        shell: bash
        run: |
          python tools/openclaw_harness/verify_release_asset.py \
            '${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}' \
            --platform '${{ matrix.release_os }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.release_os }}
          path: ${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload release asset
        run: gh release upload '${{ needs.release.outputs.tag_name }}' '${{ needs.release.outputs.asset_prefix }}_${{ matrix.release_os }}.${{ matrix.ext }}' --clobber

  checksums:
    name: Publish SHA256SUMS
    needs:
      - release
      - builds
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksum file
        run: |
          set -eu
          cd dist
          shasum -a 256 * > SHA256SUMS.txt

      - name: Upload checksum asset
        run: |
          gh release upload '${{ needs.release.outputs.tag_name }}' dist/SHA256SUMS.txt --repo '${{ github.repository }}' --clobber
